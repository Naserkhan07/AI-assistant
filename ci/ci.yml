name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt || pip install pytest python-dotenv httpx psutil
      - run: python -m pytest tests/ -q --tb=short
      - run: python -m py_compile $(find nixi -name "*.py")
